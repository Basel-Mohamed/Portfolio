    <!-- Apply the saved / system theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bm-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <!--
      Splash: shown by the browser the instant the HTML arrives, while the scripts
      download. It is plain HTML and CSS on purpose, so it needs no JavaScript to
      appear. The app fades it out once the first page is ready (see src/lib/splash.ts).
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #ffffff;
        color: #1a1a1c;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      html.dark #splash {
        background: #000000;
        color: #f4f4f6;
      }
      #splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: currentColor;
        font: 600 20px/1 Inter, -apple-system, 'Segoe UI', system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      #splash .mark span {
        color: #ffffff;
      }
      html.dark #splash .mark span {
        color: #000000;
      }
      /* The bar only appears if loading takes a moment, so fast loads show no flicker. */
      #splash .bar {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(127, 127, 127, 0.25);
        opacity: 0;
        animation: splash-in 0.3s ease 0.4s forwards;
      }
      #splash .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: currentColor;
        animation: splash-slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-in {
        to { opacity: 1; }
      }
      @keyframes splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        #splash .bar::after { animation: none; width: 100%; opacity: 0.4; }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Loading">
      <div class="mark" aria-hidden="true"><span>BM</span></div>
      <div class="bar" aria-hidden="true"></div>
    </div>
    <script>
      // Fades the splash out and removes it. Called by the app when the first page is ready,
      // and after 8 seconds regardless, so a failed script can never leave it covering the site.
      window.__hideSplash = function () {
        var splash = document.getElementById('splash');
        if (!splash || splash.classList.contains('is-done')) return;
        splash.classList.add('is-done');
        setTimeout(function () { splash.remove(); }, 500);
      };
      setTimeout(window.__hideSplash, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
